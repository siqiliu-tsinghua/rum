[package]
name = "rum-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Derive macros for rum runtime data contracts."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
rum-runtime = { path = "../rum-runtime", features = ["test-builtin-memory-growth"] }
