[package]
name = "rum-jupyter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["development-tools"]
description = "Jupyter adapter and transport layer for rum host sessions."

[dependencies]
bytes = "1"
futures = "0.3"
hmac.workspace = true
rum-host = { path = "../rum-host" }
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
zeromq = "0.5"

[dev-dependencies]
rum-host = { path = "../rum-host", features = ["test-builtin-memory-growth"] }
