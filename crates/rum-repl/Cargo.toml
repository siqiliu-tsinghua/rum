[package]
name = "rum-repl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Interactive shell layer for rum."

[features]
default = ["hash"]
hash = ["rum-host/hash", "rum-terminal/hash"]

[dependencies]
rum-host = { path = "../rum-host", default-features = false }
rum-syntax = { path = "../rum-syntax" }
rum-terminal = { path = "../rum-terminal", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "termios", "fs", "event", "pipe"] }
signal-hook = "0.3.18"

[dev-dependencies]
rum-runtime = { path = "../rum-runtime", features = ["test-builtin-memory-growth"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["pty"] }
