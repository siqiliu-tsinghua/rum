[package]
name = "rum-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Terminal rendering helpers for rum diagnostics, messages, and inspection."

[features]
default = ["hash"]
hash = ["rum-host/hash"]

[dependencies]
rum-host = { path = "../rum-host", default-features = false }

[dev-dependencies]
rum-runtime = { path = "../rum-runtime", features = ["test-builtin-memory-growth"] }
