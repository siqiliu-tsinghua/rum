[package]
name = "rum-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line entry point for rum."

[features]
default = ["hash"]
hash = ["rum-repl/hash", "rum-host/hash", "rum-terminal/hash"]
# Layer B B0 measurement scaffold: wrap mimalloc in a counting allocator.
# Off by default so the production build is bare mimalloc with zero per-alloc cost.
alloc-count = []

[dependencies]
mimalloc = "0.1.52"
rum-repl = { path = "../rum-repl", default-features = false }
rum-host = { path = "../rum-host", default-features = false }
rum-syntax = { path = "../rum-syntax" }
rum-terminal = { path = "../rum-terminal", default-features = false }

[dev-dependencies]
rum-runtime = { path = "../rum-runtime", features = ["test-builtin-memory-growth"] }
